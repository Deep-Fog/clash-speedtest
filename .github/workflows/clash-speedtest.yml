name: Refactor Clash SpeedTest

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install clash-speedtest
        run: |
          wget -O clash-speedtest.tar.gz https://github.com/faceair/clash-speedtest/releases/latest/download/clash-speedtest_Linux_x86_64.tar.gz
          tar -xzf clash-speedtest.tar.gz
          chmod +x clash-speedtest
          sudo mv clash-speedtest /usr/local/bin/

      - name: Run clash Speedtest
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          ARGS=()
          while IFS= read -r line || [ -n "$line" ]; do
            url=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [[ -n "$url" && ! "$url" =~ ^# ]]; then
              ARGS+=("-c" "$url")
            fi
          done <<< "$SUB_URL"

          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "::error::未发现有效的订阅链接，请检查 Secret (SUB_URL) 配置！"
            exit 1
          fi

          clash-speedtest "${ARGS[@]}" \
            -output result.yaml \
            -max-latency 800ms \
            -min-download-speed 5 \
            -rename

      - name: Update Gist
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -f "result.yaml" ]; then
            gh gist edit "$GIST_ID" result.yaml
          fi
