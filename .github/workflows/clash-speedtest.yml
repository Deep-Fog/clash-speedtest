name: Refactor Clash SpeedTest

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install clash-speedtest
        run: |
          wget -O clash-speedtest.tar.gz https://github.com/faceair/clash-speedtest/releases/latest/download/clash-speedtest_Linux_x86_64.tar.gz
          tar -xzf clash-speedtest.tar.gz
          chmod +x clash-speedtest
          sudo mv clash-speedtest /usr/local/bin/

      - name: Download and Fix Subscriptions
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          mkdir -p configs
          i=0
          while IFS= read -r line || [ -n "$line" ]; do
            url=$(echo "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [[ -n "$url" && ! "$url" =~ ^# ]]; then
              i=$((i+1))
              echo "下载订阅 #$i..."
              curl -sL --max-time 30 "$url" -o "configs/sub_$i.yaml"
              size=$(wc -c < "configs/sub_$i.yaml")
              echo "  大小: $size bytes"
              # 修复 fingerprint 字段兼容性问题
              sed -i 's/^\([[:space:]]*\)fingerprint:/\1client-fingerprint:/' "configs/sub_$i.yaml"
            fi
          done <<< "$SUB_URL"

          echo "=========================================="
          echo "共下载 $i 个订阅文件"
          echo "=========================================="

      - name: Run clash Speedtest
        run: |
          CONFIG_LIST=$(find "$PWD/configs" -name "sub_*.yaml" -printf "%p," | sed 's/,$//')

          if [ -z "$CONFIG_LIST" ]; then
            echo "::error::未发现有效的订阅配置文件！"
            exit 1
          fi

          echo "=========================================="
          echo "配置文件: $CONFIG_LIST"
          echo "=========================================="

          clash-speedtest -c "$CONFIG_LIST" \
            -output result.yaml \
            -max-latency 800ms \
            -min-download-speed 5 \
            -rename

      - name: Update Gist
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -f "result.yaml" ]; then
            gh gist edit "$GIST_ID" result.yaml
          fi
